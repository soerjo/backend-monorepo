name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        continue-on-error: true
        run: bun audit

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint (check-only, no --fix)
        run: bunx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Type check
        run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        continue-on-error: true
        run: bun audit

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests (metrics + middleware, explicit config)
        run: bunx jest src/modules/metrics src/common/middleware --config jest.config.js

  build:
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        continue-on-error: true
        run: bun audit

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build
        run: bun run build

  openapi-drift-check:
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Regenerate OpenAPI contract
        run: bun run docs:openapi

      - name: Fail on OpenAPI drift
        run: |
          if git diff --exit-code -- contracts/openapi.json; then
            echo "OpenAPI contract is up to date."
          else
            echo "=== OpenAPI CONTRACT DRIFT DETECTED ==="
            echo "The committed contracts/openapi.json is out of sync with the current code."
            echo "Run 'bun run docs:openapi' and commit the result."
            echo ""
            git diff -- contracts/openapi.json
            exit 1
          fi
